<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inventory Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#29457c",
                        "surface-container-highest": "#e3e2e7",
                        "inverse-surface": "#2f3034",
                        "on-tertiary-fixed": "#2e1500",
                        "primary-container": "#1e3c72",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#8da8e5",
                        "surface-bright": "#faf9fe",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#eeedf2",
                        "tertiary": "#402000",
                        "background": "#faf9fe",
                        "tertiary-fixed-dim": "#ffb77b",
                        "on-secondary-container": "#681986",
                        "on-background": "#1a1b1f",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#dd9a61",
                        "inverse-on-surface": "#f1f0f5",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#747781",
                        "outline-variant": "#c4c6d1",
                        "on-surface-variant": "#44474f",
                        "error": "#ba1a1a",
                        "primary": "#00255a",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#f9d8ff",
                        "on-error": "#ffffff",
                        "secondary-container": "#e08efe",
                        "surface-container-low": "#f4f3f8",
                        "primary-fixed": "#d8e2ff",
                        "surface-dim": "#dad9df",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#ffdcc2",
                        "surface-variant": "#e3e2e7",
                        "primary-fixed-dim": "#aec6ff",
                        "on-primary-fixed": "#001a42",
                        "on-tertiary-fixed-variant": "#6b3b07",
                        "surface-container-high": "#e9e7ed",
                        "on-secondary-fixed": "#320046",
                        "secondary": "#883ca6",
                        "surface": "#faf9fe",
                        "tertiary-container": "#603200",
                        "surface-tint": "#425d95",
                        "on-secondary-fixed-variant": "#6e208c",
                        "inverse-primary": "#aec6ff",
                        "secondary-fixed-dim": "#edb1ff",
                        "on-surface": "#1a1b1f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "container-margin": "32px",
                        "gutter": "24px",
                        "stack-lg": "24px",
                        "unit": "4px",
                        "padding-card": "24px"
                    },
                    "fontFamily": {
                        "h2": ["Space Grotesk"],
                        "h3": ["Space Grotesk"],
                        "body-md": ["Space Grotesk"],
                        "body-lg": ["Space Grotesk"],
                        "h1": ["Space Grotesk"],
                        "body-sm": ["Space Grotesk"],
                        "label-md": ["Space Grotesk"],
                        "label-sm": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "h2": ["32px", { "lineHeight": "1.25", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "h3": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "h1": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.04em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  <style>
#addSection, #inventorySection {
    display: none;
}
</style>
  </head>
<body class="bg-background text-on-background antialiased selection:bg-primary-container selection:text-on-primary min-h-screen pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky full-width top-0 z-50 border-b border-slate-200 dark:border-slate-800 shadow-sm flex justify-between items-center w-full px-6 py-3">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-blue-900 dark:text-blue-400 text-xl font-bold" data-icon="inventory_2">inventory_2</span>
<span class="font-['Space_Grotesk'] text-sm tracking-tight font-medium text-blue-900 dark:text-blue-400 font-bold">Smart Inventory System</span>
</div>
<div class="md:hidden flex items-center">
<span class="material-symbols-outlined text-slate-500 hover:text-blue-900 transition-colors" data-icon="menu">menu</span>
</div>
<nav class="hidden md:flex gap-6">
    <a onclick="showSection('dashboardSection')" class="text-sm font-medium text-slate-500 hover:text-blue-600 transition">
    Dashboard
</a>

<a onclick="showSection('addSection')" class="text-sm font-medium text-slate-500 hover:text-blue-600 transition">
    Add Asset
</a>

<a onclick="showSection('inventorySection')" class="text-sm font-medium text-blue-600 font-bold">
    Inventory
</a>
</nav>
</header>
<main class="max-w-[1440px] mx-auto px-4 md:px-container-margin py-stack-lg flex flex-col gap-stack-lg">
<section id="dashboardSection">
<h1 class="font-h2 text-h2 text-on-background mb-stack-md">
    Inventory Hub
</h1>
<div class="mt-6 flex justify-center">
    <div style="width: 300px; height: 300px;">
        <canvas id="myChart"></canvas>
    </div>
</div>
<!-- 📊 CATEGORY BAR CHART -->
<div class="mt-10 flex justify-center">
    <div style="width: 400px; height: 300px;">
        <canvas id="barChart"></canvas>
    </div>
</div>

<!-- 📈 TREND LINE CHART -->
<div class="mt-10 flex justify-center">
    <div style="width: 500px; height: 300px;">
        <canvas id="lineChart"></canvas>
    </div>
</div>

<!-- 📅 DATE FILTER -->
<div class="mt-6 flex gap-4 justify-center">
    <input type="date" id="startDate" class="border p-2 rounded">
    <input type="date" id="endDate" class="border p-2 rounded">
    <button onclick="loadItems()" class="bg-blue-500 text-white px-4 py-2 rounded">
        Filter
    </button>
</div>
<!-- Dashboard Stats -->
<div class="grid grid-cols-3 gap-stack-sm md:gap-stack-md">

    <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-stack-md flex flex-col justify-center items-center shadow-[0_4px_20px_0_rgba(30,60,114,0.05)]">
        <span class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-1">Total Items</span>
        <span id="totalTop" class="font-h3 text-h3 text-on-background">0</span>
    </div>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-stack-md flex flex-col justify-center items-center shadow-[0_4px_20px_0_rgba(30,60,114,0.05)]">
        <span class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-1">Working</span>
        <span id="workingCount" class="font-h3 text-h3 text-primary-container">0</span>
    </div>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-stack-md flex flex-col justify-center items-center shadow-[0_4px_20px_0_rgba(30,60,114,0.05)]">
        <span class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-1">Faulty</span>
        <span id="faultyCount" class="font-h3 text-h3 text-error">0</span>
    </div>

</div>
</section>
<!-- ✅ ADD ASSET SECTION -->
<section id="addSection" class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-lg shadow-[0_4px_20px_0_rgba(30,60,114,0.05)]">

    <h2 class="font-h3 text-h3 text-on-background mb-stack-md">Add New Asset</h2>

    <div class="flex justify-between items-center mb-4">
        <input id="search" placeholder="Search items..."
            class="border border-gray-300 px-3 py-2 rounded-lg w-64">

        <p id="totalCount" class="font-semibold text-gray-600"></p>
    </div>

    <p class="text-sm text-gray-500 mt-2 mb-4">
        Manage your inventory efficiently 🚀
    </p>

    <!-- FORM -->
    <form id="itemForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <div>
            <label>Category</label>
            <select id="category" class="w-full border p-2 rounded">
                <option>Keyboard</option>
                <option>Mouse</option>
                <option>Monitor</option>
                <option>CPU</option>
            </select>
        </div>

        <div>
            <label>Brand</label>
            <input id="brand" type="text" class="w-full border p-2 rounded">
        </div>

        <div>
            <label>Model</label>
            <input id="model" type="text" class="w-full border p-2 rounded">
        </div>

        <div>
            <label>Specifications</label>
            <input id="specs" type="text" class="w-full border p-2 rounded">
        </div>

        <div>
            <label>Quantity</label>
            <input id="quantity" type="number" class="w-full border p-2 rounded">
        </div>

        <div>
            <label>Purchase Date</label>
            <input id="date" type="date" class="w-full border p-2 rounded">
        </div>

        <div class="md:col-span-2">
            <label>Condition</label>
            <select id="condition" class="w-full border p-2 rounded">
                <option>Working</option>
                <option>Faulty</option>
                <option>Repair</option>
            </select>
        </div>

        <div class="md:col-span-2">
            <button type="submit"
                class="bg-blue-600 text-white px-4 py-2 rounded-lg">
                + Add Item
            </button>
        </div>

    </form>
</section>
<!-- Inventory List -->
<section id="inventorySection">

    <h2 class="font-h3 text-h3 text-on-background mb-stack-sm">
        Current Inventory
    </h2>

    <div id="items"></div>

</section>
<!-- BottomNavBar -->
<nav class="md:hidden bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 shadow-[0_-4px_20px_0_rgba(30,60,114,0.05)] docked full-width bottom-0 rounded-t-xl fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe">
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-1 hover:text-blue-700 dark:hover:text-blue-300 scale-100 active:scale-95 transition-transform duration-150" onclick="showSection('dashboardSection')">

<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-['Space_Grotesk'] text-[11px] font-semibold uppercase tracking-wider mt-1">Dashboard</span>

</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-1 hover:text-blue-700 dark:hover:text-blue-300 scale-100 active:scale-95 transition-transform duration-150" href="#addSection">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
<span class="font-['Space_Grotesk'] text-[11px] font-semibold uppercase tracking-wider mt-1">Add Asset</span>
</a>
<a class="flex flex-col items-center justify-center text-blue-900 dark:text-blue-300 bg-blue-50 dark:bg-blue-900/20 rounded-lg px-4 py-1 hover:text-blue-700 dark:hover:text-blue-300 scale-100 active:scale-95 transition-transform duration-150" href="#inventorySection">
<span class="material-symbols-outlined" data-icon="list_alt">list_alt</span>
<span class="font-['Space_Grotesk'] text-[11px] font-semibold uppercase tracking-wider mt-1">Inventory</span>
</a>
</nav>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>
</body></html>
